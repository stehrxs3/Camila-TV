<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camila TV+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo">Camila<span class="plus"> tv+</span></h1>
            <nav class="categories">
                <button class="cat-btn active" onclick="filtrarCategoria('todos', this)">Início</button>
                <button class="cat-btn" onclick="filtrarCategoria('Shows', this)">Shows</button>
                <button class="cat-btn" onclick="filtrarCategoria('Performances', this)">Performances</button>
                <button class="cat-btn" onclick="filtrarCategoria('Entrevistas', this)">Entrevistas</button>
                <button class="cat-btn" onclick="filtrarCategoria('Vlogs', this)">Vlogs</button>
                <button class="cat-btn" onclick="filtrarCategoria('Movie & Series', this)">Movie & Series</button>
            </nav>
        </div>

        <div class="nav-right">
            <button class="live-btn" onclick="abrirTransmissaoAoVivo()">
                <span class="live-dot"></span> AO VIVO
            </button>
            <input type="text" id="searchInput" placeholder="Pesquisar título..." oninput="filtrarPorBusca()">
        </div>
    </header>

    <section class="hero" id="heroBanner">
        <div class="hero-content">
            <span class="badge" id="heroBadge"> Em Destaque</span>
            <h2 id="heroTitle">Título do Destaque</h2>
            <p id="heroDesc">Descrição breve do conteúdo que está em destaque.</p>

            <div class="hero-buttons">
                <button class="btn-primary" onclick="playHeroVideo()">▶ Assistir</button>
                <button class="btn-secondary" onclick="playHeroVideo()">ⓘ Mais informações</button>
            </div>
        </div>
    </section>

    <main class="container">
        <h2 class="section-title" id="sectionTitle">Todos os Conteúdos</h2>
        <div class="video-grid" id="videoGrid"></div>
    </main>


    
    <div id="videoModal" class="modal">
        <div class="modal-content modal-clean">
            <span class="close-btn" onclick="fecharVideo()">&times;</span>
 

            <div class="iframe-container" id="videoContainer">
                <iframe id="videoPlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>


            <div class="modal-info-body">
                <h2 id="modalVideoTitle" class="video-info-title">Título do Vídeo</h2>

                <div class="video-meta-tags">
                    <span id="modalVideoCategory" class="badge-category">Shows</span>
                    <span class="meta-divider">•</span>
                    <span id="modalVideoDate" class="meta-item">2025</span>
                </div>

                <p id="modalVideoDesc" class="video-info-desc">
                    Descrição completa do conteúdo.
                </p>
            </div>
        </div>
    </div>

   
    <div id="liveModal" class="modal">
        <div class="modal-content modal-clean">
            <span class="close-btn" onclick="fecharLive()">&times;</span>
            <div class="modal-header-info">
                <span class="modal-video-title">🔴 Transmissão Ao Vivo - Camila TV</span>
            </div>
            <div class="iframe-container">
                <iframe id="livePlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
